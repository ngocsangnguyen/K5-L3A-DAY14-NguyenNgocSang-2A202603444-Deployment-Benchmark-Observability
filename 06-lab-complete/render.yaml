# Blueprint path: 06-lab-complete/render.yaml; paths are repository-relative.
services:
  - type: web
    name: day14-agent
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: REDIS_URL
        fromService:
          type: redis
          name: day14-redis
          property: connectionString
  - type: redis
    name: day14-redis
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
